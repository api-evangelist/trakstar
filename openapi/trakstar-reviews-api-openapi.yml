openapi: 3.2.0
info:
  title: Trakstar Hire Reviews API
  description: The Trakstar Hire REST API (formerly Recruiterbox) enables developers to manage openings, candidates, candidate messages, internal notes, interviews, reviews, evaluations, and to-dos programmatically. It returns JSON responses and uses API key authentication generated from the account's Super Admin settings. The most common use cases include building custom career sites and syncing opening or candidate data with external systems.
  version: '2'
  contact:
    name: Trakstar Hire Support
    url: https://support.hire.trakstar.com/article/1617-accessing-the-hire-api
  license:
    name: Proprietary
servers:
- url: https://{companyName}.hire.trakstar.com/api/v2
  description: Trakstar Hire API v2
  variables:
    companyName:
      description: Your company subdomain name
      default: yourcompany
security:
- apiKey: []
tags:
- name: Reviews
  description: Manage candidate reviews
paths:
  /reviews:
    get:
      operationId: listReviews
      summary: List Reviews
      description: Returns a list of reviews, optionally filtered by candidate.
      tags:
      - Reviews
      parameters:
      - name: candidate
        in: query
        description: Filter reviews by candidate ID.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: A list of reviews.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reviews/{id}:
    get:
      operationId: getReview
      summary: Get Review
      description: Returns a single review by ID.
      tags:
      - Reviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: A single review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication credentials were not provided or are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
    Review:
      type: object
      description: A review of a candidate.
      properties:
        id:
          type: integer
          description: Unique identifier for the review.
          readOnly: true
        candidate:
          type: integer
          description: ID of the candidate being reviewed.
        rating:
          type:
          - string
          - 'null'
          description: Overall rating from the review.
        comments:
          type:
          - string
          - 'null'
          description: Review comments.
        reviewer:
          type:
          - string
          - 'null'
          description: Name or identifier of the reviewer.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the review was created.
          readOnly: true
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: API key generated from the Trakstar Hire Super Admin settings page. Pass as "ApiKey {your_api_key}".
externalDocs:
  description: Trakstar Hire API Reference
  url: https://developers.recruiterbox.com/reference/introduction
